# This workflow publishes the package to registry.npmjs.org using trusted publishing (OIDC).
# No npm token is involved: GitHub Actions mints a short-lived OIDC token that npm exchanges
# for publish rights, based on the trusted publisher configured on npmjs.com.
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Publish to npmjs.org

on:
  workflow_dispatch

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm falls back to token auth and fails

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x' # ships npm >= 11.5.1, the minimum for trusted publishing
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm publish --access public
